<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Descripción del Usuario')"></head>
<body>
<nav th:replace="fragments :: navbar"></nav>
<div class="container-fluid">
    <div class="row mt-3">
        <div class="col-8 offset-2">
            <h2>Detalles del Usuario</h2>
            <div class="card mt-3">
                <div class="card-body">
                    <table class="table table-borderless">
                        <tbody>
                        <tr>
                            <th scope="row" style="width: 25%">Identificador:</th>
                            <td th:text="${usuarioDetalle.id}"></td>
                        </tr>
                        <tr>
                            <th scope="row">Correo electrónico:</th>
                            <td th:text="${usuarioDetalle.email}"></td>
                        </tr>
                        <tr>
                            <th scope="row">Nombre:</th>
                            <td th:text="${usuarioDetalle.nombre ?: 'No especificado'}"></td>
                        </tr>
                        <tr>
                            <th scope="row">Fecha de Nacimiento:</th>
                            <td th:text="${usuarioDetalle.fechaNacimiento != null ? #dates.format(usuarioDetalle.fechaNacimiento, 'dd-MM-yyyy') : 'No especificada'}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="mt-3">
                <a class="btn btn-primary" th:href="@{/registrados}">Volver al listado</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments::javascript" />
</body>
</html>
