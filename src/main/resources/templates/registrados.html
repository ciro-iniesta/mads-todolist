<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Usuarios Registrados')"></head>
<body>
<!-- Incluimos la barra de menú en la parte superior -->
<div th:replace="fragments :: navbar"></div>

<div class="container-fluid">
    <div class="row mt-3">
        <div class="col">
            <h2>Listado de usuarios registrados</h2>
            <!-- Tabla usando clases estándar de Bootstrap -->
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Identificador</th>
                    <th>Correo electrónico</th>
                </tr>
                </thead>
                <tbody>
                <!-- Iteramos sobre la lista de usuarios pasada por el controller -->
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.email}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments::javascript" />
</body>
</html>
